name: Build Android Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main  # Or your main branch name
  pull_request:
    branches:
      - main  # Or your main branch name

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: kernel_build
      KERNEL_DIR: neutrino_kernel_oneplus_sm8250  # Name of the kernel source directory
      ROOT_DIR_PREFIX: Cabage-OP12-SUSFS # Define a root dir prefix as we cannot access the name to prefix
      BRANCH: ${{ github.ref_name }} # Get the branch name

    steps:
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev make rsync unzip zlib1g-dev zip gcc-10 g++-10

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Build Bot"
          git config --global user.email "actions@github.com" # Generic email is fine
          
      - name: Set up GononClang Toolchain
        run: |
          # Download GononClang toolchain
          wget https://github.com/Gonon-Kernel/gonon-clang/releases/download/16.0.6-20231104-release/GononClang-16.0.6-20231104.tar.xz
          
          # Extract the toolchain
          tar -xvf GononClang-16.0.6-20231104.tar.xz
          
          # Set environment variables for the toolchain
          export TOOLCHAIN_DIR=$(pwd)/GononClang-16.0.6-20231104
          export PATH=$TOOLCHAIN_DIR/bin:$PATH
          
          # Verify the toolchain is available
          clang --version
          echo "Using GononClang toolchain from $TOOLCHAIN_DIR"
      
      - name: Create Build Directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Download Kernel Source
        uses: actions/checkout@v3
        with:
          repository: cabagekiller/neutrino_kernel_oneplus_sm8250
          path: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
          fetch-depth: 0  # Required for proper git describe

      - name: Clone Required Repositories
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/TheWildJames/AnyKernel3.git -b android-4.19
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
          git clone https://github.com/cabagekiller/kernel_patches.git
      - name: Setup KernelSU (Submodule Integration)
        working-directory: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs-dev
          git submodule update --init --recursive
          cd KernelSU-Next/kernel
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count HEAD) "+" 10200)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" Makefile
      - name: Setup SUSFS
        working-directory: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          ls -a
          SUSFS_PATCHES="${GITHUB_WORKSPACE}/${{ env.BUILD_DIR }}/susfs4ksu/kernel_patches"
          KERNEL_PATCHES="${GITHUB_WORKSPACE}/${{ env.BUILD_DIR }}/kernel_patches"
          KSU_NEXT="KernelSU-Next"
          mkdir -p ./fs ./include/linux
          cp "${SUSFS_PATCHES}/fs/"* ./fs/
          cp "${SUSFS_PATCHES}/include/linux/"* ./include/linux/
          cp "${SUSFS_PATCHES}/50_add_susfs_in_kernel-4.19.patch" ./
          cp "${KERNEL_PATCHES}/69_hide_stuff.patch" ./
          #cp "${KERNEL_PATCHES}/next/next_hooks.patch" ./
          cp "${KERNEL_PATCHES}/next/syscall_hooks.patch" ./
          patch -p1 -F 3 < syscall_hooks.patch
          #patch -p1 --forward < next_hooks.patch || echo "Warning: KernelSU SUSFS patch may have been already applied or failed."
          patch -p1 -F 3 < 50_add_susfs_in_kernel-4.19.patch || echo "Warning: SUSFS patch may have been already applied."
          patch -p1 -F 3 < 69_hide_stuff.patch || echo "Warning: 69_hide_stuff patch may have been already applied."
          
          #sed -i '/obj-$(CONFIG_KSU_SUSFS_SUS_SU) += sus_su.o/d' ./fs/Makefile
          git diff --quiet --exit-code || (git add -A && git commit -m "BUILD Kernel (SUSFS setup)" || true)
          git diff --quiet --exit-code || (git add -A && git commit -m "BUILD Kernel (SUSFS setup)" || true)
      - name: Configure Kernel Defconfig
        working-directory: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
           # Add SUSFS configuration settings
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig #changed gki_defconfig to the current defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_KSU_WITH_KPROBES=n" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          # Add additional tmpfs config setting
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          # Add additional tmpfs config setting
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "# CONFIG_LTO_CLANG is not set" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "# CONFIG_POLLY_CLANG is not set" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "# CONFIG_SHADOW_CALL_STACK is not set" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_ARCH_MMAP_RND_BITS=18" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_ARCH_MMAP_RND_COMPAT_BITS=11" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_VMAP_STACK=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_PANIC_ON_REFCOUNT_ERROR=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          echo "CONFIG_RELR=y" >> ./arch/arm64/configs/neutrino_kebab_defconfig
          sed -i '2s/check_defconfig//' ./build.config.gki
      - name: Finalize Kernel Configuration
        working-directory: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          # Use Clang toolchain instead of GCC
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=clang
      
          # Prepare the kernel configuration
          make mrproper CC=clang HOSTCC=clang ARCH=arm64
          make neutrino_kebab_defconfig CC=clang HOSTCC=clang ARCH=arm64
          make olddefconfig CC=clang HOSTCC=clang ARCH=arm64
          make savedefconfig CC=clang HOSTCC=clang ARCH=arm64
          cp defconfig arch/arm64/configs/neutrino_kebab_defconfig
          make prepare CC=clang HOSTCC=clang ARCH=arm64


      - name: Manually Export msm_audio.h Headers
        working-directory: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
        run: |
          mkdir -p usr/include/linux
          mkdir -p usr/techpack/audio/include/linux
          find techpack/audio/include/uapi/linux/ -name "msm_audio*.h" -exec cp {} usr/include/linux/ \;
          find techpack/audio/include/uapi/linux/ -name "msm_audio*.h" -exec cp {} usr/techpack/audio/include/linux/ \;
          
     

      - name: Build Kernel with GCC
        working-directory: ${{ env.BUILD_DIR }}/${{ env.KERNEL_DIR }}
        run: |
          # Build the kernel
          make -j$(nproc) CC=clang HOSTCC=clang ARCH=arm64
      
          # Optionally, build kernel modules (if needed)
          #make modules -j$(nproc) CC=clang HOSTCC=clang
          
          # Install the modules (optional)
          #make modules_install CC=clang HOSTCC=clang
          
          # Install the kernel (optional, use with caution)
          # make install CC=clang HOSTCC=clang
          
          # Output some build information
          echo "Kernel build completed successfully"
      - name: Create ZIP Package
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euxo pipefail
          mkdir -p AnyKernel3
          touch AnyKernel3/Image
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image AnyKernel3/Image || { echo "Error copying Image file"; exit 1; } # Use correct path
          cd AnyKernel3
          ZIP_NAME="${{ env.ROOT_DIR_PREFIX }}-${{ steps.timestamp.outputs.CURRENT_TIMESTAMP }}.zip" # use the timestamp var to build name
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*
          ls -lh "../$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV
      - name: Set current timestamp
        id: timestamp
        run: echo "CURRENT_TIMESTAMP=$(date -u +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.BUILD_DIR }}/${{ env.zip_name }}
          tag_name: release-${{ steps.timestamp.outputs.CURRENT_TIMESTAMP }} # Simple, safe tag - make tag name include timestamp output
          name: Release ${{ env.ROOT_DIR_PREFIX }} ${{ steps.timestamp.outputs.CURRENT_TIMESTAMP }} #Include timestamp output in release name.
          body: |
             Release for ${{ env.ROOT_DIR_PREFIX }} based on branch ${{ env.BRANCH }}
             KSU Version: ${{ env.KSUVER }}  # Still *include* KSUVER in the body
             Timestamp: ${{ steps.timestamp.outputs.CURRENT_TIMESTAMP }} #Include timestamp output in release body.
